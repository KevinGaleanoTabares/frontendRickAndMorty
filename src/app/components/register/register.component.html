<div class="flex justify-center items-center h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-md w-80"> 
        <h2 class="text-2xl font-bold mb-4 text-center"> Registro  </h2>

        <input [(ngModel)]="user.name" name="name" placeholder="Nombre"
        class="w-full mb-2 p-2 border rounded"/>


        <input [(ngModel)]="user.email" name="email" placeholder="Correo"
        class="w-full mb-2 p-2 border rounded"/>


        <input [(ngModel)]="user.password" name="password" placeholder="Contraseña"
        class="w-full mb-2 p-2 border rounded"/>


        <input [(ngModel)]="user.age" name="age" placeholder="Edad"
        class="w-full mb-2 p-2 border rounded"/>

        <button (click)="register()"
        class="w-full bg-blue-500 text-white p-2 rounded">
        Registrarse
        </button>

        <p class="text-center mt-2">
            ¿Ya tienes cuenta?
            <span class="text-blue-500 cursor-pointer" (click)="goLogin()">Login</span>
        </p>
    </div>
</div>
