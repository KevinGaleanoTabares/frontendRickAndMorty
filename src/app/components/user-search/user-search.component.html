<div class="flex items-center gap-6 mb-6 w-full">
<input [(ngModel)]= "searchText" placeholder="Buscar Usuario" class="p-3 border rounded-lg flex-1 shadow-md text-base focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <button (click)="searchUser()" class="bg-blue-500 hover:bg-blue-600 transition text-white px-6 py-3 rounded-lg shadow-md">
        Buscar
    </button>
    <button (click)="openModal()" class="bg-green-500 hover:bg-green-600 transition text-white px-6 py-3 rounded-lg shadow-md">
            Añadir Usuario
        </button>
</div>
