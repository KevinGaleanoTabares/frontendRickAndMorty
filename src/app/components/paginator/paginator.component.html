<div class="bg-blue-700 text-white p-3 sm:p-4 flex flex-col sm:flex-row gap-2 sm:gap-4 sm:justify-end items-start sm:items-center">

<button
    (click)="goCharacters()"
    class="bg-white text-blue-500 px-3 sm:px-4 py-2 rounded-sm text-xs sm:text-sm hover:bg-gray-100 transition">
    Personajes
</button>

<button
    (click)="goUsers()"
    class="bg-white text-blue-500 px-3 sm:px-4 py-2 rounded-sm text-xs sm:text-sm hover:bg-gray-100 transition">
    Usuarios
</button>

<button
    (click)="goProfile()"
    class="bg-white text-blue-500 px-3 sm:px-4 py-2 rounded-sm text-xs sm:text-sm hover:bg-gray-100 transition">
    Perfil
</button>

<button
    (click)="openLogoutModal()"
    class="bg-red-500 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm hover:bg-red-600 transition">
    Cerrar sesion
</button>
</div>

<div
*ngIf="showLogoutModal"
class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">

    <div class="bg-white p-6 rounded shadow w-80">

        <h2 class="text-xl font-bold mb-4">
            Confirmación
        </h2>

        <p class="mb-4">
            ¿Está seguro de que desea cerrar sesión?
        </p>

        <div class="flex justify-end gap-3">

            <button
            (click)="cancelLogout()"
            class="bg-gray-500 text-white px-4 py-2 rounded">

                Cancelar

            </button>

            <button
            (click)="confirmLogout()"
            class="bg-red-500 text-white px-4 py-2 rounded">

                Cerrar Sesión

            </button>

        </div>

    </div>

</div>
