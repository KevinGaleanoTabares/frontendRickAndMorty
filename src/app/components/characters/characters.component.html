<app-paginator></app-paginator>

<div class="p-4 sm:p-6 bg-gray-100 min-h-screen"> <!-- min-h-screen y las lineas 15 - 16 -->

    <h1 class="text-2xl sm:text-3xl mb-6 font-bold">
        Personajes Rick and Morty
    </h1>

    <app-character-img>

    </app-character-img>

    <app-character-search
    
    (searchCharacter)="receiveCharacterSearch($event)">

    </app-character-search>

    <app-character-table
    [characters]="characters" 
    [characterSearch]="characterSearch"> 
    </app-character-table>

    <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 justify-center items-center mt-6 mb-6 flex-wrap">

        <button (click)="prevPage()" class="bg-blue-500 text-white px-3 sm:px-4 py-2 rounded text-sm sm:text-base hover:bg-blue-600 transition"> Anterior </button>
        <span class="font-bold text-sm sm:text-base"> Pagina {{  currentPage  }} de {{  totalPages  }} </span>
        <button (click)="nextPage()" class="bg-blue-500 text-white px-3 sm:px-4 py-2 rounded text-sm sm:text-base hover:bg-blue-600 transition"> Siguiente </button>

    </div>


</div>
