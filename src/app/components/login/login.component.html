<div class="flex justify-center items-center h-screen bg-gray-100">
  <div class="bg-white p-6 rounded-lg shadow-md w-80">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>

    <input [(ngModel)]="user.email" name="email" placeholder="Correo"
      class="w-full mb-2 p-2 border rounded"/>

    <input [(ngModel)]="user.password" name="password" type="password" placeholder="Contraseña"
      class="w-full mb-4 p-2 border rounded"/>

    <button (click)="login()"
      class="w-full bg-green-500 text-white p-2 rounded">
      Iniciar sesión
    </button>

    <p class="text-center mt-2">
        ¿No tienes cuenta?
        <span class="text-blue-500 cursor-pointer" (click)="goRegister()">Registrate</span>
    </p>
  </div>
</div>
